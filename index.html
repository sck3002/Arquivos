<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Notas</title>
<style>
:root{--bg:#111113;--bg2:#1b1b1f;--bg3:#26262b;--tx:#f2f2f4;--tx2:#9a9aa3;--ac:#4f7cff;--ln:#2c2c32;--r:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:12px;width:100%;outline:none}
input:focus{border-color:var(--ac)}
.hide{display:none!important}

/* topo */
.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 14px;padding-top:env(safe-area-inset-top);background:rgba(17,17,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.topo h1{flex:1;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{color:var(--tx2);font-size:13px;font-weight:400;margin-left:6px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--bg3)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* álbuns */
.albuns{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px;padding:14px 12px 100px}
.alb{text-align:left}
.alb .capa{aspect-ratio:1;border-radius:var(--r);background:var(--bg2) center/cover no-repeat;display:grid;place-items:center;color:var(--tx2);overflow:hidden}
.alb .capa svg{width:34px;height:34px;opacity:.5;fill:none;stroke:currentColor;stroke-width:1.6}
.alb b{display:block;margin-top:6px;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alb small{color:var(--tx2);font-size:12px}

/* grade */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px;padding:2px 0 100px}
.cel{position:relative;aspect-ratio:1;background:var(--bg2) center/cover no-repeat}
.cel.vid::after{content:"";position:absolute;right:6px;bottom:6px;width:0;height:0;border-left:11px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 0 2px #000)}
.cel.sel{outline:3px solid var(--ac);outline-offset:-3px}
.vazio{padding:60px 24px;text-align:center;color:var(--tx2)}

/* botão flutuante */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:6}
.fab svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}

/* barra de envio */
.envio{position:fixed;left:10px;right:10px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--bg3);border-radius:var(--r);padding:10px 12px;z-index:7;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.envio .bar{height:4px;background:var(--ln);border-radius:2px;margin-top:7px;overflow:hidden}
.envio .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}

/* folha inferior */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}
.folha{width:100%;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:16px 16px 0 0;padding:8px 0 calc(10px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.folha h3{margin:6px 18px 8px;font-size:14px;font-weight:500;color:var(--tx2)}
.folha .it{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;text-align:left}
.folha .it:active{background:var(--bg3)}
.folha .it.perigo{color:#ff6b6b}
.folha .it small{margin-left:auto;color:var(--tx2)}
.folha .campo{padding:6px 18px 4px}
.folha .acoes{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px 2px}
.bt{padding:10px 16px;border-radius:8px;font-weight:500}
.bt.pri{background:var(--ac);color:#fff}
.bt.sec{color:var(--tx2)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--tx2);font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--ac)}

/* visualizador */
.vis{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;touch-action:pan-y}
.vis .vt{display:flex;align-items:center;gap:6px;padding:6px;padding-top:calc(6px + env(safe-area-inset-top));background:linear-gradient(#000c,#0000);position:absolute;top:0;left:0;right:0;z-index:2;transition:opacity .2s}
.vis .vt .info{flex:1;min-width:0;font-size:13px;line-height:1.25}
.vis .vt .info b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vis .vt .info span{color:#bbb}
.vis .palco{flex:1;display:grid;place-items:center;overflow:hidden}
.vis .palco img,.vis .palco video{max-width:100%;max-height:100vh;object-fit:contain;display:block}
.vis .palco video{max-height:calc(100vh - 72px);margin-bottom:60px}   /* controles do vídeo acima da barra de comentários */
.vis.limpo .vt,.vis.limpo .vb{opacity:0;pointer-events:none}
/* comentários */
.vb{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:26px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000d);transition:opacity .2s;display:flex;align-items:center;gap:10px;text-align:left;width:100%;font-size:14px}
.vb svg{width:22px;height:22px;flex:none;fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round}
.vb .ult{flex:1;min-width:0;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb .ult b{color:#fff;font-weight:500}
.cmt{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:72vh;display:flex;flex-direction:column;background:var(--bg2);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
.cmt .cab{display:flex;align-items:center;padding:6px 6px 6px 16px;border-bottom:1px solid var(--ln);font-weight:500}
.cmt .cab span{flex:1}
.cmt .lst{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.cmt .vz{color:var(--tx2);text-align:center;padding:24px 0;font-size:14px}
.bal{max-width:82%;padding:7px 11px;border-radius:14px;background:var(--bg3);align-self:flex-start;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bal.meu{align-self:flex-end;background:#2f4fb3}
.bal small{display:block;font-size:11px;color:#ffffffa0;margin-bottom:2px}
.cmt .env{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.cmt textarea{flex:1;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:9px 14px;resize:none;outline:none;max-height:110px;line-height:1.3}
.cmt textarea:focus{border-color:var(--ac)}
.cmt .mand{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:none}
.cmt .mand svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cel .nc{position:absolute;left:5px;bottom:5px;background:#000a;color:#fff;font-size:11px;padding:1px 6px 1px 5px;border-radius:9px;display:flex;align-items:center;gap:3px}
.cel .nc svg{width:11px;height:11px;fill:none;stroke:#fff;stroke-width:2.4}
/* conversa livre */
.ib.ponto{position:relative}
.ib.ponto::after{content:"";position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--ac);border:2px solid var(--bg)}
.chat{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.chat .lst{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.chat .dia{align-self:center;color:var(--tx2);font-size:12px;background:var(--bg2);padding:3px 10px;border-radius:10px;margin:8px 0 2px}
.chat .vz{color:var(--tx2);text-align:center;margin:auto;font-size:14px}
.chat .env,.cmt .env{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:var(--bg2)}
.chat textarea{flex:1;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:9px 14px;resize:none;outline:none;max-height:110px;line-height:1.3}
.chat textarea:focus{border-color:var(--ac)}
.chat .mand{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:none}
.chat .mand svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bal small.h{text-align:right;margin:2px 0 0}
.carreg{color:#ccc;font-size:13px;text-align:center}
.giro{width:30px;height:30px;border:3px solid #fff3;border-top-color:#fff;border-radius:50%;margin:0 auto 10px;animation:g 0.8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:380px;margin:0 auto}
.login h2{margin:0 0 4px;font-size:24px}
.login p{color:var(--tx2);margin:0 0 22px}
.login .bt{width:100%;margin-top:12px;padding:14px}
.erro{color:#ff6b6b;font-size:13px;min-height:18px;margin-top:10px}

/* disfarce: bloco de notas */
html.claro,html.claro body{background:#fafafa;color:#1d1d1f}
.nt-topo{padding:calc(22px + env(safe-area-inset-top)) 20px 10px}
.nt-topo h1{margin:0;font-size:32px;font-weight:700;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.nt-topo small{color:#8a8a8e;font-size:13px}
.nt-lista{margin:6px 14px 100px;background:#fff;border-radius:12px;overflow:hidden}
.nt-it{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid #ececf0}
.nt-it:last-child{border-bottom:0}
.nt-it b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-it span{display:block;color:#8a8a8e;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-vazio{padding:40px;text-align:center;color:#8a8a8e}
.nt-fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:#f2b705;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.nt-fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round}
.nt-ed{position:fixed;inset:0;background:#fafafa;display:flex;flex-direction:column;z-index:3}
.nt-ed .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;color:#c79500}
.nt-ed .bar .ib svg{stroke:#c79500}
.nt-ed textarea{flex:1;border:0;background:transparent;padding:8px 20px 40px;font:17px/1.45 system-ui,-apple-system,Roboto,sans-serif;color:#1d1d1f;resize:none;outline:none}
.trava .pin{letter-spacing:10px;text-align:center;font-size:22px}
.trava .ln{color:var(--tx2);font-size:13px;text-align:center;margin-top:14px}
.trava .ln button{text-decoration:underline;color:var(--tx2)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:50;max-width:90vw;text-align:center}
.tela-c{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--tx2)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="arquivos" accept="image/*,video/*" multiple class="hide">
<script src="config.js"></script>
<script type="module">
import { Storage } from 'https://unpkg.com/megajs@1.3.10/dist/main.browser-es.mjs';

/* ================= configuração ================= */
const CFG = window.GALERIA_CONFIG || null;
const PASTA_RAIZ = 'Arquivos';
const PASTA_MINI = '.miniaturas';
const PASTA_CHAT = '.conversa';     // cada mensagem é uma pastinha vazia com o texto criptografado
const CH_VISTO = 'notas.v';         // até onde a conversa já foi lida neste aparelho
const ALBUM_PADRAO = 'Geral';
const CH_SESS = 'notas.s';        // sessão do MEGA, trancada pela senha de cada um
const CH_NOTAS = 'notas.itens';   // notas do disfarce
const SESS_ITER = 200000;
const FOTO_MAX = 2560;          // lado maior da foto reduzida (px)
const FOTO_QUAL = 0.85;         // qualidade JPEG da foto reduzida
const MINI_LADO = 360;          // miniatura quadrada (px)
const MEM_FOTOS = 15;            // fotos mantidas só na memória (nada é gravado no aparelho)
const URL_MB = 'https://unpkg.com/mediabunny@1.66.4/dist/bundles/mediabunny.min.mjs';  // conversor de vídeo (carrega só ao enviar vídeo)
const VID_LADO = 1280;           // vídeo reduzido: 720p (lado maior 1280)
const VID_BITRATE = 2500000;     // ~2,5 Mbps: boa qualidade na tela do celular
const RX_IMG = /\.(jpe?g|png|webp|gif|heic|heif|bmp|avif)$/i;
const RX_VID = /\.(mp4|mov|m4v|webm|3gp|mkv)$/i;

const S = {
  storage: null, nome: '', raiz: null, mini: null,
  miniMap: new Map(),   // nodeId -> arquivo de miniatura no MEGA
  album: null,          // pasta aberta (ou 'todos')
  lista: [], idx: 0,    // itens da grade e posição no visualizador
  enviando: false,
  desbloqueado: false,
  ignorarOculto: false  // seletor de arquivos tira o app da tela sem ser "saída"
};

/* ================= utilidades ================= */
const app = document.getElementById('app');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICO = {
  voltar: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  mais: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  menu: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>',
  pasta: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
  baixar: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  lixo: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  balao: '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  enviar: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg>',
  fechar: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const ehImg = f => RX_IMG.test(f.name || '');
const ehVid = f => RX_VID.test(f.name || '');
const ehMidia = f => !f.directory && (ehImg(f) || ehVid(f));
const dataBR = ts => ts ? new Date(ts * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const tamanho = b => b > 1e9 ? (b / 1e9).toFixed(1).replace('.', ',') + ' GB' : (b / 1e6).toFixed(0) + ' MB';
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = u8 => btoa(String.fromCharCode(...u8));

function toast(msg, ms = 2800) {
  if (!S.desbloqueado) return;   // nunca mostra aviso no disfarce
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function msgErro(e) {
  const m = String(e?.message || e || '');
  if (e?.timeLimit || /Bandwidth limit/i.test(m)) {
    const min = Math.ceil((+e.timeLimit || 0) / 60);
    return 'Limite de transferência do MEGA atingido' + (min ? ` — libera em cerca de ${min} min` : '') + '.';
  }
  if (/ESID|-15/.test(m)) return 'Sessão expirada. Entre de novo.';
  if (/EOVERQUOTA|-17/.test(m)) return 'Espaço do MEGA esgotado.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Sem conexão com o MEGA.';
  return 'Erro: ' + m;
}

/* ================= cache só na memória ================= */
// Nada de foto ou vídeo é gravado no aparelho: tudo some ao bloquear ou fechar o app.
try { indexedDB.deleteDatabase('arquivos-cache'); indexedDB.deleteDatabase('nossa-galeria'); } catch {}
try { ['arq.sessao', 'ng.sessao', 'notas.k'].forEach(k => localStorage.removeItem(k)); } catch {}
const mem = new Map();
async function cacheGet(k) { return mem.get(k) || null; }
async function cachePut(k, v) {
  if (k.startsWith('f:')) {
    if (v.size > 40e6) return;                       // vídeos grandes não ficam nem na memória
    const fotos = [...mem.keys()].filter(x => x.startsWith('f:'));
    if (fotos.length >= MEM_FOTOS) mem.delete(fotos[0]);
  }
  mem.set(k, v);
}
async function cacheDel(k) { mem.delete(k); }
function cacheLimpar() { mem.clear(); urlsMini.forEach(u => URL.revokeObjectURL(u)); urlsMini.clear(); }

/* ================= credenciais protegidas ================= */
async function chaveDe(segredo, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(segredo), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function abrirCredenciais(u, senha) {
  const chave = await chaveDe(senha, b64d(u.salt), CFG.iter);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(u.iv) }, chave, b64d(u.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function salvarSessao(senha) {
  const j = S.storage.toJSON();
  j.options = { userAgent: null };            // nunca guarda e-mail/senha do MEGA
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const chave = await chaveDe(senha, salt, SESS_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chave, new TextEncoder().encode(JSON.stringify({ nome: S.nome, s: j }))));
  localStorage.setItem(CH_SESS, JSON.stringify({ salt: b64(salt), iv: b64(iv), ct: b64(ct) }));
}
async function abrirSessao(senha) {
  try {
    const reg = JSON.parse(localStorage.getItem(CH_SESS) || 'null');
    if (!reg) return null;
    const chave = await chaveDe(senha, b64d(reg.salt), SESS_ITER);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(reg.iv) }, chave, b64d(reg.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { return null; }
}

/* ================= inicialização ================= */
function modo(m) {
  document.documentElement.className = m;
  document.querySelector('meta[name=theme-color]').content = m === 'claro' ? '#fafafa' : '#111113';
}
function iniciar() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  history.replaceState({ t: 'notas' }, '');
  telaNotas();
}

/* ================= disfarce: bloco de notas ================= */
function lerNotas() {
  try { const n = JSON.parse(localStorage.getItem(CH_NOTAS)); if (Array.isArray(n)) return n; } catch {}
  const dia = 864e5, agora = Date.now();
  const ini = [
    { id: 2, c: 'Lista de compras\narroz\nfeijão\ncafé\ndetergente\npapel toalha', d: agora - dia * 2 },
    { id: 1, c: 'Lembretes\npagar conta de luz dia 10\nlevar o carro na revisão\nrenovar seguro', d: agora - dia * 11 }
  ];
  localStorage.setItem(CH_NOTAS, JSON.stringify(ini));
  return ini;
}
const gravarNotas = n => localStorage.setItem(CH_NOTAS, JSON.stringify(n));
const tituloNota = n => (n.c.split('\n')[0] || '').trim() || 'Nova nota';
const resumoNota = n => n.c.split('\n').slice(1).join(' ').trim() || 'Sem texto adicional';
const dataCurta = ms => {
  const d = new Date(ms), h = new Date();
  return d.toDateString() === h.toDateString() ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('pt-BR');
};
function telaNotas() {

function telaSenha() {
  modo('escuro');
  app.innerHTML = `
  <div class="login trava">

    // 1) caminho rápido: reabre a sessão guardada neste aparelho
    const sess = await abrirSessao(senha);

      try {
        if (!(S.storage && S.enviando)) {         // se um envio continuou por trás, reaproveita a conexão
          S.storage = Storage.fromJSON(sess.s);
          await S.storage.reload();
        }
        S.nome = sess.nome;

        return;
      } catch (e) {
        console.warn('sessão guardada não abriu, entrando de novo', e);

        localStorage.removeItem(CH_SESS);
      }
    }

    // 2) primeira vez no aparelho (ou sessão expirada): abre o login do MEGA pela senha
    let cred, quem;

      [cred, quem] = await Promise.any(CFG.usuarios.map(u => abrirCredenciais(u, senha).then(c => [c, u])));
    } catch { falha('Senha incorreta.'); campo.value = ''; return; }

      S.storage = new Storage({ email: cred.email, password: cred.password, userAgent: null });

      await S.storage.ready;
      S.nome = quem.nome;
      await salvarSessao(senha);
      await posLogin();
    } catch (e) {
      console.warn(e);
      falha(msgErro(e));
    }

async function posLogin() {
  const st = S.storage;
  S.raiz = (st.root.children || []).find(f => f.directory && f.name === PASTA_RAIZ) || await st.root.mkdir(PASTA_RAIZ);
  S.mini = filhos(S.raiz).find(f => f.directory && f.name === PASTA_MINI) || await S.raiz.mkdir(PASTA_MINI);
  S.chat = filhos(S.raiz).find(f => f.directory && f.name === PASTA_CHAT) || await S.raiz.mkdir(PASTA_CHAT);
  if (!albuns().length) await S.raiz.mkdir(ALBUM_PADRAO);
  reconstruirMiniMap();

  // atualizações em tempo real (envios feitos no outro celular)
  if (!st._ligado) {
    st._ligado = true;
    let t;
    const atualizar = () => { clearTimeout(t); t = setTimeout(() => { if (S.storage !== st) return; reconstruirMiniMap(); redesenhar(); }, 400); };
    st.on('add', atualizar); st.on('delete', atualizar); st.on('move', atualizar); st.on('update', atualizar);
    // comentário novo do outro lado aparece na hora, com o visualizador aberto
    st.on('update', f => { if (S.storage === st && S.desbloqueado && S.lista[S.idx] === f && $('.vis')) { barraComentarios(); desenharComentarios(); } });
  }
  S.desbloqueado = true;
  modo('escuro');
  history.replaceState({ t: 'albuns' }, '');
  mostrarAlbuns();
}

const quando = f => f.attributes?.dt ? f.attributes.dt / 1000 : (f.timestamp || 0);   // data de envio (fixa, em s)

function reconstruirMiniMap() {

/* ================= fila de downloads de miniaturas ================= */
const fila = []; let ativos = 0;
function enfileirar(fn) {
  return new Promise((res, rej) => { fila.push({ fn, res, rej }); bombear(); });
}
function bombear() {
  while (ativos < 4 && fila.length) {
    const { fn, res, rej } = fila.shift(); ativos++;
    fn().then(res, rej).finally(() => { ativos--; bombear(); });
  }
}
const urlsMini = new Map(); // nodeId -> objectURL
async function urlMiniatura(f) {
  if (urlsMini.has(f.nodeId)) return urlsMini.get(f.nodeId);
  let blob = await cacheGet('m:' + f.nodeId);
  if (!blob) {
    const mf = S.miniMap.get(f.nodeId);
    if (mf) {
      blob = new Blob([await enfileirar(() => mf.downloadBuffer({}))], { type: 'image/jpeg' });
    } else if (ehImg(f)) {
      // enviado por fora do app: gera miniatura a partir da foto
      const orig = await obterMidia(f);
      blob = await gerarMiniatura(orig, false);
    }
    if (blob) cachePut('m:' + f.nodeId, blob);
  }
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  urlsMini.set(f.nodeId, u);
  return u;
}
const obs = new IntersectionObserver(ents => {
  for (const e of ents) {
    if (!e.isIntersecting) continue;
    obs.unobserve(e.target);
    const f = e.target._f;
    urlMiniatura(f).then(u => { if (u) e.target.style.backgroundImage = `url("${u}")`; }).catch(err => console.warn('mini', err));
  }
}, { rootMargin: '300px' });

/* ================= download da mídia completa ================= */
function baixarComProgresso(f, onProg) {
  return new Promise((res, rej) => {
    const partes = [];
    const s = f.download({});
    s.on('data', d => partes.push(d));
    s.on('progress', p => onProg && onProg(p.bytesLoaded / (p.bytesTotal || f.size || 1)));
    s.on('error', rej);
    s.on('end', () => res(new Blob(partes, { type: tipoMime(f) })));
  });
}
function tipoMime(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  return ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', heic: 'image/heic', heif: 'image/heif', avif: 'image/avif', bmp: 'image/bmp',
    mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm', '3gp': 'video/3gpp', mkv: 'video/x-matroska' })[ext] || 'application/octet-stream';
}
async function obterMidia(f, onProg) {
  const c = await cacheGet('f:' + f.nodeId);
  if (c) return c;
  const b = await baixarComProgresso(f, onProg);
  cachePut('f:' + f.nodeId, b);
  return b;
}

function rotuloDia(ms) {
  const d = new Date(ms), h = new Date(), o = new Date(Date.now() - 864e5);
  if (d.toDateString() === h.toDateString()) return 'Hoje';
  if (d.toDateString() === o.toDateString()) return 'Ontem';
  return d.toLocaleDateString('pt-BR');
}
function desenharChat() {
  const l = $('#chLst');
  if (!l) return;
  const ms = mensagens();
  const noFim = l.scrollHeight - l.scrollTop - l.clientHeight < 80;
  let dia = '', html = '';
  for (const m of ms) {
    const a = m.attributes, r = rotuloDia(a.t);
    if (r !== dia) { dia = r; html += `<div class="dia">${r}</div>`; }
    const hora = new Date(a.t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    html += `<div class="bal${a.p === S.nome ? ' meu' : ''}" data-id="${m.nodeId}">${esc(a.x)}<small class="h">${hora}</small></div>`;
  }
  l.innerHTML = html || '<div class="vz">Nenhuma mensagem ainda.</div>';
  if (noFim || !l.dataset.ok) l.scrollTop = l.scrollHeight;
  l.dataset.ok = 1;
  marcarLido();
  // segurar a própria mensagem permite apagar
  l.querySelectorAll('.bal.meu').forEach(b => b.addEventListener('contextmenu', e => {
    e.preventDefault();
    const m = S.storage.files[b.dataset.id];
    if (!m) return;
    folha(`<h3>Apagar esta mensagem?</h3>
      <div class="acoes"><button class="bt sec" data-a="x">Cancelar</button><button class="bt pri" data-a="ok">Apagar</button></div>`,
      async a => { if (a === 'ok') { try { await m.delete(true); desenharChat(); } catch (er) { toast(msgErro(er)); } } });
  }));
}
let enviandoMsg = false;
async function enviarMensagem() {
  const ta = $('#chTxt');
  const x = (ta?.value || '').trim().slice(0, 2000);
  if (!x || enviandoMsg) return;
  enviandoMsg = true; $('#chEnv').style.opacity = .5;
  try {
    const t = Date.now();
    await S.chat.mkdir({ name: String(t), attributes: { p: S.nome, t, x } });
    ta.value = ''; ta.oninput();
    desenharChat();
    const l = $('#chLst'); if (l) l.scrollTop = l.scrollHeight;
  } catch (e) { toast(msgErro(e)); }

const filaEnvio = [];
async function enviar(arqs, alb, reduzir) {
  for (const a of arqs) filaEnvio.push({ a, alb, reduzir });
  estadoEnvio.total += arqs.length;
  if (S.enviando) { mostrarBarraEnvio(); return; }
  S.enviando = true;
  let erros = 0;
  while (filaEnvio.length) {
    const { a, alb: destino, reduzir: red } = filaEnvio.shift();
    estadoEnvio.pct = 0; mostrarBarraEnvio();
    try { await enviarUm(a, destino, red); }
    catch (e) { console.warn(e); erros++; toast(`Falhou: ${a.name} — ${msgErro(e)}`, 4000); }
    estadoEnvio.feito++;
  }
  S.enviando = false;
  const ok = estadoEnvio.feito - erros;
  estadoEnvio.total = 0; estadoEnvio.feito = 0;
  mostrarBarraEnvio();
  toast(ok ? `${ok} ${ok === 1 ? 'arquivo enviado' : 'arquivos enviados'}.` : 'Nenhum arquivo enviado.');
  if (!S.desbloqueado) { desligarMega(); return; }
  redesenhar();
}

async function enviarUm(arq, alb, reduzir) {
  const video = arq.type.startsWith('video/') || RX_VID.test(arq.name);
  let corpo = arq, nome = arq.name || ('arquivo-' + Date.now());
  if (!video && reduzir) {
    const r = await reduzirFoto(arq).catch(() => null);
    if (r && r.size < arq.size) { corpo = r; nome = nome.replace(/\.[^.]+$/, '') + '.jpg'; }
  }
  if (video && reduzir) {
    estadoEnvio.fase = 'Preparando vídeo'; estadoEnvio.pct = 0; mostrarBarraEnvio();
    const r = await comprimirVideo(arq, p => { estadoEnvio.pct = p; mostrarBarraEnvio(); }).catch(e => { console.warn('conversão', e); return null; });
    if (r && r.size < arq.size * 0.85) { corpo = r; nome = nome.replace(/\.[^.]+$/, '') + '.mp4'; }
  }
  estadoEnvio.fase = 'Enviando'; estadoEnvio.pct = 0; mostrarBarraEnvio();
  if (!video && !RX_IMG.test(nome)) nome += '.jpg';
  const mini = await gerarMiniatura(corpo, video).catch(() => null);

  const up = alb.upload({ name: nome, size: corpo.size, attributes: { por: S.nome, dt: Date.now() } });
  up.on('progress', p => { estadoEnvio.pct = p.bytesUploaded / (p.bytesTotal || 1); mostrarBarraEnvio(); });
  const fim = up.complete;
  // envia em pedaços, sem carregar o vídeo inteiro na memória
  const leitor = corpo.stream().getReader();
  for (;;) {
    const { done, value } = await leitor.read();
    if (done) { up.end(); break; }
    if (!up.write(value)) await Promise.race([new Promise(r => up.once('drain', r)), fim]);
  }
  const novo = await fim;

  // guarda no aparelho para não baixar de novo
  if (S.desbloqueado) cachePut('f:' + novo.nodeId, corpo);
  if (mini) {
    if (S.desbloqueado) cachePut('m:' + novo.nodeId, mini);
    const buf = new Uint8Array(await mini.arrayBuffer());
    try { const mf = await S.mini.upload({ name: novo.nodeId + '.jpg' }, buf).complete; S.miniMap.set(novo.nodeId, mf); } catch (e) { console.warn('mini up', e); }
  }
}

/* ================= vídeo: reduzir para 720p no próprio aparelho ================= */
// Usa o codificador de vídeo do celular (WebCodecs). Se o aparelho não suportar,
// ou o vídeo já for leve, devolve null e o original é enviado.
async function comprimirVideo(arq, onProg) {
  if (!('VideoEncoder' in window)) return null;
  const MB = await import(URL_MB);
  const input = new MB.Input({ source: new MB.BlobSource(arq), formats: MB.ALL_FORMATS });
  const vt = await input.getPrimaryVideoTrack();
  if (!vt) return null;
  const dur = await input.computeDuration();
  const w = vt.displayWidth, h = vt.displayHeight;
  // já é leve (baixa resolução e baixa taxa): não vale converter
  if (dur > 0 && (arq.size * 8 / dur) < VID_BITRATE * 1.4 && Math.max(w, h) <= VID_LADO * 1.1) return null;
  const k = Math.min(1, VID_LADO / Math.max(w, h));
  const W = Math.round(w * k / 2) * 2, H = Math.round(h * k / 2) * 2;
  if (!(await MB.canEncodeVideo('avc', { width: W, height: H, bitrate: VID_BITRATE }))) return null;
  const at = await input.getPrimaryAudioTrack();
  const opcoesVideo = { ...(w >= h ? { width: W } : { height: H }), codec: 'avc', bitrate: VID_BITRATE };
  const montar = async audio => {
    const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: 'in-memory' }), target: new MB.BufferTarget() });
    const conv = await MB.Conversion.init({ input, output, tracks: 'primary', video: opcoesVideo, audio, showWarnings: false });
    return { output, conv };
  };
  // 1ª tentativa: áudio AAC (padrão do celular) copiado como está, sem reconverter
  let { output, conv } = await montar(at && at.codec === 'aac' ? { codec: 'aac' } : { discard: true });
  const perdeuAudio = at && !conv.utilizedTracks.some(t => t.type === 'audio');
  if (perdeuAudio || (at && at.codec !== 'aac')) {
    // 2ª: reconverte o áudio para um formato que o aparelho consiga gerar
    const ac = await MB.getFirstEncodableAudioCodec(['aac', 'opus'], { numberOfChannels: 2, sampleRate: 48000, bitrate: 128000 });
    if (ac) ({ output, conv } = await montar({ codec: ac, bitrate: 128000 }));
  }
  if (!conv.isValid) return null;
  conv.onProgress = p => onProg && onProg(p);
  await conv.execute();
  return new Blob([output.target.buffer], { type: 'video/mp4' });
}

/* ================= vídeo: tocar enquanto baixa ================= */
// O service worker busca do MEGA só o trecho que o player pede e decifra na hora.
function falarComSW(msg, espera = 1500) {
  const sw = navigator.serviceWorker?.controller;
  if (!sw) return Promise.resolve(null);
  return new Promise(res => {
    const ch = new MessageChannel();
    const t = setTimeout(() => res(null), espera);
    ch.port1.onmessage = e => { clearTimeout(t); res(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}
async function prepararStream(f) {
  if (!navigator.serviceWorker?.controller || !f.key || f.key.length < 32) return false;
  try {
    const r = await S.storage.api.request({ a: 'g', g: 1, n: f.nodeId, ssl: 2 });
    if (!r || typeof r.g !== 'string' || !/^https?:/.test(r.g)) return false;
    const k = f.key, aes = new Uint8Array(16);
    for (let i = 0; i < 16; i++) aes[i] = k[i] ^ k[i + 16];
    const ok = await falarComSW({ tipo: 'video', id: f.nodeId, url: r.g, size: r.s, mime: tipoMime(f) === 'video/quicktime' ? 'video/mp4' : tipoMime(f),
      aes: Array.from(aes), nonce: Array.from(k.slice(16, 24)) });
    return !!ok?.ok;
  } catch (e) { console.warn('stream', e); return false; }
}

/* ================= imagens: reduzir e miniatura ================= */
async function bitmapDe(blob) {
  try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); }
  catch {
    const u = URL.createObjectURL(blob);
    try {
      const img = new Image(); img.src = u; await img.decode(); return img;
    } finally { setTimeout(() => URL.revokeObjectURL(u), 1000); }
  }
}
function canvasPara(blob, q) {
  return new Promise(r => blob.toBlob(r, 'image/jpeg', q));
}
async function reduzirFoto(arq) {
  if (/gif$/i.test(arq.type)) return null; // mantém GIF animado
  const bmp = await bitmapDe(arq);
  const w = bmp.width, h = bmp.height;
  const k = Math.min(1, FOTO_MAX / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close?.();
  return canvasPara(c, FOTO_QUAL);
}
async function quadroDoVideo(blob) {
  const u = URL.createObjectURL(blob);
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = u;
  try {
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = rej; setTimeout(rej, 10000); });
    v.currentTime = Math.min(1, (v.duration || 2) / 2);
    await new Promise((res, rej) => { v.onseeked = res; setTimeout(res, 4000); });
    return v;
  } catch { URL.revokeObjectURL(u); return null; }
  finally { setTimeout(() => URL.revokeObjectURL(u), 5000); }
}
async function gerarMiniatura(blob, video) {
  const fonte = video ? await quadroDoVideo(blob) : await bitmapDe(blob);
  if (!fonte) return null;
  const w = fonte.videoWidth || fonte.width, h = fonte.videoHeight || fonte.height;
  if (!w || !h) return null;
  const lado = Math.min(w, h);
  const c = document.createElement('canvas');
  c.width = c.height = MINI_LADO;
  c.getContext('2d').drawImage(fonte, (w - lado) / 2, (h - lado) / 2, lado, lado, 0, 0, MINI_LADO, MINI_LADO);
  fonte.close?.();
  return canvasPara(c, 0.75);
}
